<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#1b3a2c"/>
  <title>Strong Legs — Lipedema, Neuropathy &amp; Knee OA Plan</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --cream:#f6f1e9;--forest:#1b3a2c;--forest2:#2a5c42;
      --amber:#c4813a;--amber2:#e09a4f;--sage:#6b9278;
      --sage-light:#a8c5ad;--text:#2a2318;--muted:#7a7060;
      --card:#fdfaf5;--border:#e4ddd0;--sh:0 4px 18px rgba(27,58,44,0.08);
      --rose:#b5486a;--rose-bg:#fbeef2;
      --teal:#2e6f78;--teal-bg:#e6f2f3;
      --plum:#6a4b8a;--plum-bg:#f1ecf7;
    }
    html,body,#root{height:100%;margin:0;padding:0;}
    /* paint the ground on html too, so any surrounding canvas (previews,
       embeds, phone browsers overscrolling) shows cream rather than black */
    html{background:var(--cream);}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);-webkit-text-size-adjust:100%;}
    /* dvh keeps the layout honest when a mobile URL bar shows and hides */
    .db{height:100vh;height:100dvh;min-height:520px;display:flex;flex-direction:column;overflow:hidden;}
    .hdr{background:var(--forest);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px;}
    .hbrand{display:flex;align-items:center;gap:11px;min-width:0;}
    .hlogo{width:37px;height:37px;background:linear-gradient(135deg,var(--amber),var(--amber2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 8px rgba(196,129,58,0.4);flex-shrink:0;}
    .htitle{font-family:'Playfair Display',serif;color:var(--cream);font-size:18px;font-weight:700;line-height:1.2;}
    .hsub{color:var(--sage-light);font-size:9.5px;font-weight:300;margin-top:1px;letter-spacing:0.6px;}
    .huser{color:var(--sage-light);font-size:11px;text-align:right;flex-shrink:0;}
    .huser strong{color:var(--cream);font-size:12px;display:block;}
    .layout{display:flex;flex:1;overflow:hidden;}
    .sidebar{width:196px;background:var(--forest);flex-shrink:0;overflow-y:auto;border-right:1px solid rgba(255,255,255,0.07);}
    .sitem{padding:10px 15px;color:var(--sage-light);font-size:12.5px;cursor:pointer;border-left:3px solid transparent;transition:all 0.18s;display:flex;align-items:center;gap:8px;user-select:none;}
    .sitem:hover{color:var(--cream);background:rgba(255,255,255,0.05);}
    .sitem.on{color:var(--amber2);border-left-color:var(--amber2);background:rgba(255,255,255,0.07);}
    .sfoot{padding:14px 15px;border-top:1px solid rgba(255,255,255,0.08);margin-top:8px;color:var(--sage-light);font-size:10.5px;line-height:1.6;}
    .main{flex:1;overflow-y:auto;background:var(--cream);}
    .pg{padding:20px;max-width:960px;}
    @media(max-width:660px){
      .layout{flex-direction:column;}
      .sidebar{width:100%;display:flex;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
      .sitem{padding:9px 11px;border-left:none;border-bottom:2.5px solid transparent;white-space:nowrap;font-size:11px;}
      .sitem.on{border-bottom-color:var(--amber2);border-left:none;background:rgba(255,255,255,0.07);}
      .sfoot{display:none;}
      .pg{padding:13px;}
      .htitle{font-size:15px;}
    }
    .ttl{font-family:'Playfair Display',serif;font-size:22px;color:var(--forest);margin-bottom:3px;}
    .sub{color:var(--muted);font-size:13px;margin-bottom:17px;line-height:1.6;}
    .ctitle{font-family:'Playfair Display',serif;font-size:15.5px;color:var(--forest);margin-bottom:8px;}
    .lbl{font-size:11px;font-weight:600;color:var(--forest);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:0.5px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:17px;box-shadow:var(--sh);}
    .mb{margin-bottom:11px;}
    .mb2{margin-bottom:16px;}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
    .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
    @media(max-width:660px){.g2,.g3{grid-template-columns:1fr;}.g4{grid-template-columns:1fr 1fr;}}
    .btn{padding:8px 15px;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:12.5px;cursor:pointer;border:none;transition:all 0.18s;}
    .bf{background:var(--forest);color:var(--cream);}
    .bf:hover{background:var(--forest2);}
    .ba{background:var(--amber);color:white;}
    .ba:hover:not(:disabled){background:#b5712f;}
    .btn:disabled{opacity:0.4;cursor:not-allowed;}
    .bo{background:transparent;color:var(--forest);border:1.5px solid var(--border);}
    .bo:hover{background:var(--forest);color:var(--cream);}
    .bsm{padding:5px 10px;font-size:11px;border-radius:7px;}
    .bfull{width:100%;}
    select,textarea,input[type=text],input[type=number],input[type=date]{font-family:'DM Sans',sans-serif;font-size:12.5px;border:1.5px solid var(--border);border-radius:8px;padding:8px 11px;background:white;color:var(--text);width:100%;outline:none;transition:border-color 0.2s;}
    select:focus,textarea:focus,input:focus{border-color:var(--sage);}
    textarea{resize:vertical;line-height:1.65;}
    input[type=range]{width:100%;accent-color:var(--forest);height:26px;}
    .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:500;margin:2px 3px 2px 0;}
    .tg{background:#e8f5e9;color:#2e7d32;}.ty{background:#fff8e1;color:#8d5a00;}
    .tr{background:#fce4ec;color:#c62828;}.tb{background:#e3f2fd;color:#1565c0;}
    .tp{background:#f3e5f5;color:#6a1b9a;}.tt{background:var(--teal-bg);color:var(--teal);}
    hr{border:none;border-top:1px solid var(--border);margin:15px 0;}
    .warn{background:#fff8e1;border:1px solid #ffe0a3;border-left:4px solid var(--amber);border-radius:9px;padding:12px 14px;font-size:12.5px;line-height:1.7;margin-bottom:13px;}
    .danger{background:var(--rose-bg);border:1px solid #f2c5d3;border-left:4px solid var(--rose);border-radius:9px;padding:12px 14px;font-size:12.5px;line-height:1.7;margin-bottom:13px;}
    .info{background:#f0f5f1;border:1px solid var(--sage-light);border-radius:9px;padding:12px 14px;font-size:12.5px;line-height:1.7;margin-bottom:13px;}
    .kpi{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px;text-align:center;}
    .kpiv{font-family:'Playfair Display',serif;font-size:24px;color:var(--forest);line-height:1.1;}
    .kpil{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-top:5px;}
    .exrow{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card);margin-bottom:9px;}
    .exhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
    .exname{font-weight:600;color:var(--forest);font-size:13.5px;}
    .exdose{font-size:11.5px;color:var(--amber);font-weight:500;margin-top:2px;}
    .exbody{font-size:12.5px;line-height:1.7;color:var(--text);margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;}
    .exbody ul{margin:5px 0 5px 17px;}
    .exbody li{margin-bottom:3px;}
    .exlabel{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--sage);margin-top:9px;}
    .chk{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);margin-bottom:7px;font-size:12.5px;line-height:1.55;cursor:pointer;user-select:none;}
    .chk.done{background:#eef5ef;border-color:var(--sage-light);}
    .chk input{width:17px;height:17px;flex-shrink:0;margin-top:1px;accent-color:var(--forest);}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .rowb{display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .bar{height:8px;background:var(--border);border-radius:5px;overflow:hidden;}
    .barf{height:100%;background:linear-gradient(90deg,var(--sage),var(--forest2));}
    .phase{border-left:3px solid var(--amber2);padding:2px 0 2px 13px;margin-bottom:15px;}
    .daycard{border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:var(--card);}
    .daycard.today{border-color:var(--amber2);box-shadow:0 0 0 2px rgba(224,154,79,0.18);}
    .dayname{font-size:10.5px;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted);}
    .daysess{font-weight:600;color:var(--forest);font-size:12.5px;margin-top:3px;line-height:1.35;}
    .daymin{font-size:11px;color:var(--amber);margin-top:3px;}
    table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
    table.tbl th{text-align:left;padding:7px 8px;background:#eef2ec;color:var(--forest);font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);}
    table.tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.55;}
    table.tbl tr:last-child td{border-bottom:none;}
    .mcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;color:var(--forest);font-size:12px;}
    .minput{width:74px;padding:5px 7px;font-size:12px;text-align:center;}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tmpl{background:#fbfaf7;border:1px solid var(--border);border-radius:9px;padding:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.75;white-space:pre-wrap;max-height:420px;overflow-y:auto;}
    .timer{font-family:'Playfair Display',serif;font-size:40px;color:var(--forest);text-align:center;line-height:1;}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:500;border:1.5px solid var(--border);background:white;color:var(--muted);cursor:pointer;user-select:none;margin:0 5px 5px 0;}
    .pill.on{background:var(--forest);color:var(--cream);border-color:var(--forest);}
    .foot{font-size:11px;color:var(--muted);line-height:1.65;margin-top:14px;}
    .accent{color:var(--amber);font-weight:600;}
    .sgtitle{font-family:'Playfair Display',serif;font-size:13.5px;color:var(--forest);margin:14px 0 7px;}
    @media print{
      .sidebar,.hdr,.noprint{display:none !important;}
      .db,.main{height:auto;overflow:visible;}
      .pg{max-width:100%;padding:0;}
      .card{box-shadow:none;break-inside:avoid;}
      body{background:white;}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ============================================================
   EXERCISE LIBRARY
   Every movement here is chosen to be simultaneously:
   - knee-OA safe (low compression / no deep flexion under load)
   - lipedema-friendly (pumping, non-bruising, no heavy eccentric loading)
   - neuropathy-aware (supported, shod, no unsupported single-leg balance)
   ============================================================ */
const EX = [
  // ---------- PRIME / LYMPH ----------
  { id:"breath", n:"Diaphragmatic Breathing", cat:"Prime", pos:"Lying down, knees bent", dose:"8–10 slow breaths", ph:1,
    why:"The deep breath is the engine of the whole lymphatic system. The pressure change in your chest pulls fluid up out of your legs. Doing this first is what makes everything after it drain better.",
    cues:["Hand on belly, hand on ribs.","Breathe in through the nose for 4 — the belly hand rises, the chest hand stays quiet.","Out through pursed lips for 6.","Never hold your breath."],
    mod:"Do it seated in a recliner with legs up if lying flat is uncomfortable.", watch:"Dizziness means you are going too fast. Slow down." },
  { id:"nodes", n:"Neck & Collarbone Node Opening", cat:"Prime", pos:"Seated or lying", dose:"10 circles each spot", ph:1,
    why:"Empties the drainage terminal at the base of your neck first, so there is somewhere for leg fluid to go. Drain the sink before you open the tap.",
    cues:["Feather-light — stretch the skin, do not rub or press into muscle.","Flat fingers just above each collarbone, slow circles toward the center of the neck.","Then the hollow behind each ear, then down the side of the neck."],
    mod:"Skip if you have any neck-node issues your doctor has flagged.", watch:"If it turns your skin red, you are pressing far too hard." },
  { id:"groin", n:"Groin & Hip Crease Node Stimulation", cat:"Prime", pos:"Lying down", dose:"10 pumps each side", ph:1,
    why:"The inguinal nodes in the crease of your hip are where thigh fluid drains. Waking them up before leg work is what turns exercise into a drainage session.",
    cues:["Flat hand in the crease where thigh meets torso.","Gentle press in and up toward the belly button, then release. Slow.","Both sides."],
    mod:"Can be done seated with a soft flat hand.", watch:"Tender is normal with lipedema. Sharp pain is not — ease off." },
  { id:"ankpump", n:"Ankle Pumps (legs elevated)", cat:"Prime", pos:"Lying, legs up on pillows above heart", dose:"2 × 20 each foot", ph:1,
    why:"This is your calf muscle pump — the single most effective mechanical thing you can do for fluid in the lower leg. Elevating first lets gravity help instead of fight you.",
    cues:["Pull the toes up hard toward your shin, then point away.","Big slow range — you should feel the calf tighten and release.","Elevate the legs on 2–3 pillows so the ankles sit above the heart."],
    mod:"Do it seated any time you have been still for 30 minutes.", watch:"Cramping in the calf — shorten the range and slow down." },
  { id:"ankcircle", n:"Ankle Circles / Alphabet", cat:"Prime", pos:"Lying or seated, leg extended", dose:"10 circles each way, or spell A–J", ph:1,
    why:"Keeps the ankle joint mobile and feeds movement signal into feet that are not sending much sensation back. Mobility here protects your balance.",
    cues:["Move from the ankle, not the whole leg.","Slow, big, controlled circles.","Tracing letters in the air gives the brain more to work with than plain circles."],
    mod:"Rest the calf on a rolled towel so the heel is free.", watch:"Stop before the point where the ankle clicks painfully." },
  { id:"kneerock", n:"Gentle Knee Rocking (ROM warm-up)", cat:"Prime", pos:"Seated, foot on floor", dose:"15 slow each side", ph:1,
    why:"Arthritic joints need synovial fluid moved through them before load. Ten easy swings is what turns a stiff knee into a knee that tolerates strength work.",
    cues:["Sit tall, swing the lower leg forward and back, unloaded.","Small and easy — this is oiling the hinge, not exercise.","No forcing into the painful end range."],
    mod:"Sit on a slightly higher surface so the foot swings freely.", watch:"Grinding with pain is a stop. Painless crepitus (noise) is fine." },
  { id:"heelslide", n:"Heel Slides", cat:"Prime", pos:"Lying on back", dose:"2 × 10 each leg", ph:1,
    why:"Restores knee bend range without any body weight on the joint. Losing knee flexion is what eventually makes stairs and cars hard, so you protect it now.",
    cues:["Slide the heel toward the buttock as far as comfortable, then straighten fully.","A plastic bag or sock under the heel makes it glide.","Full straightening at the end matters as much as the bend."],
    mod:"Loop a belt around the foot and assist the slide with your arms.", watch:"Move to the point of stretch, not into pain." },

  // ---------- STRENGTH: KNEE & HIP ----------
  { id:"quadset", n:"Quad Sets (isometric)", cat:"Strength", pos:"Lying, leg straight", dose:"3 × 10, hold 5 sec", ph:1,
    why:"The single most protective exercise for an arthritic knee. It rebuilds the quadriceps that hold the kneecap in its groove — with zero joint movement, so it never aggravates the cartilage.",
    cues:["Press the back of the knee down into the bed and tighten the thigh.","Pull the kneecap up toward the hip.","Hold 5, relax 5. Breathe through it."],
    mod:"Roll a small towel under the knee if fully straight is uncomfortable.", watch:"None — this is your safest exercise. Do it on flare days too." },
  { id:"slr", n:"Straight Leg Raise", cat:"Strength", pos:"Lying on back", dose:"3 × 8–12 each leg", ph:1,
    why:"Loads the quad through the hip instead of the knee — you build the muscle that supports the joint without bending the joint at all. The best strength-to-risk ratio you have.",
    cues:["Set the quad first (tighten it), THEN lift.","Lift only to the height of the opposite bent knee.","Lower slowly — count 3 down. The slow lower is where the muscle is built.","Bend the other knee with the foot flat to protect your back."],
    mod:"Too hard? Do quad sets only. Too easy? Add a 1–2 lb ankle weight in Phase 3.", watch:"Low back arching = your leg is going too high. Lower the range." },
  { id:"sac", n:"Short-Arc Quad", cat:"Strength", pos:"Lying, rolled towel under knee", dose:"3 × 10 each leg", ph:1,
    why:"Trains the last 30 degrees of knee straightening — the exact range that gives you a stable knee at heel strike when you walk. Weakness here is why knees buckle.",
    cues:["Rolled towel or pool noodle under the knee so it stays slightly bent.","Straighten only the lower leg, lifting the heel off the bed.","Squeeze the thigh hard at the top for 2 seconds, lower slowly."],
    mod:"Thicker roll = smaller, easier arc.", watch:"Keep the back of the knee on the roll the whole time." },
  { id:"bridge", n:"Glute Bridge", cat:"Strength", pos:"Lying, knees bent, feet flat", dose:"3 × 10, hold 3 sec", ph:1,
    why:"Strong glutes take load off the knees on every step, and the hip motion pumps the deep pelvic lymphatics. Two problems, one exercise.",
    cues:["Feet hip-width, heels close enough to graze with the fingertips.","Squeeze the buttocks FIRST, then lift the hips.","Ribs stay down — do not arch the low back to get higher.","Lower one vertebra at a time."],
    mod:"Phase 3: march slowly at the top, or lift one heel.", watch:"Hamstring cramp — move the feet slightly further from your body." },
  { id:"clamband", n:"Clamshell with Band", cat:"Strength", pos:"Side lying, knees bent 45°", dose:"3 × 12 each side", ph:2,
    why:"Builds the gluteus medius on the side of the hip. This is the muscle that stops the knee from caving inward — and inward collapse is what wears the inner knee compartment.",
    cues:["Light loop band just above the knees.","Hips stacked, heels together, lift only the top knee.","No rolling backward — a hand on the floor behind you keeps you honest.","Slow open, slower close."],
    mod:"No band at first. Seated version: band above knees, press the knees apart in a chair.", watch:"Feel it on the SIDE of the hip. Low back burn means you rolled back." },
  { id:"hipabd", n:"Standing Hip Abduction (counter support)", cat:"Strength", pos:"Standing, both hands on counter", dose:"2 × 12 each leg", ph:2,
    why:"Same hip stabilizer as the clamshell, but upright, which teaches it to fire when you actually walk. The counter hold is non-negotiable with neuropathy.",
    cues:["Both hands on a solid counter — this is a strength exercise, not a balance test.","Lift the leg straight out to the side, toes pointing forward.","Small range: 6–8 inches is plenty.","Stand tall, do not lean away."],
    mod:"Add a light band at the ankles in Phase 3.", watch:"If you cannot keep both hands down, this is not your exercise yet." },
  { id:"hamcurl", n:"Standing Hamstring Curl", cat:"Strength", pos:"Standing, hands on counter", dose:"2 × 12 each leg", ph:2,
    why:"Hamstrings are the knee's rear brake. Balanced quad and hamstring strength is what stops the joint being pulled unevenly.",
    cues:["Hands on the counter, stand tall.","Bend one knee, bringing the heel toward the buttock.","Keep the thighs side by side — do not swing the knee forward.","Lower with control."],
    mod:"Seated alternative: press the heel back into a chair leg and hold 5 seconds.", watch:"Hamstring cramping is common — stop the set and stretch gently." },
  { id:"tke", n:"Terminal Knee Extension (band)", cat:"Strength", pos:"Standing, band anchored in front", dose:"3 × 12 each leg", ph:2,
    why:"Directly trains the knee to lock out straight under load — the position of maximum stability. Excellent for arthritic knees because there is no bend under compression.",
    cues:["Loop a band around the back of the knee, anchored at knee height in front of you.","Start with a slight bend, then straighten the knee against the band pull.","Squeeze the quad at the end, 2 seconds.","Foot stays flat, heel down."],
    mod:"No anchor? Do short-arc quads instead — same target muscle.", watch:"Do not snap into a locked knee. Controlled straightening only." },
  { id:"s2s", n:"Sit-to-Stand", cat:"Strength", pos:"Sturdy chair, no wheels", dose:"3 × 6–10", ph:2,
    why:"The most functional leg strength exercise there is, and the one that predicts independence best. It builds quads and glutes together in the exact pattern you use fifty times a day.",
    cues:["Feet flat, hips-width, heels under the knees.","Nose over toes — lean the chest forward, then drive up through the heels.","Sit back down SLOWLY — 3 counts. The lowering is the real work.","Chair height sets the difficulty."],
    mod:"Too hard? Add a firm cushion to raise the seat, or push off the armrests. Phase 3: lower chair, arms crossed on chest.", watch:"Knees should track over the 2nd toe, not fall inward. Stop if the knee pain climbs past 4/10." },
  { id:"stepup", n:"Low Step-Up (4-inch step)", cat:"Strength", pos:"Low step, handrail", dose:"2 × 8 each leg", ph:3,
    why:"Loads one leg at a time in a shallow, knee-friendly range and forces the hip stabilizers to work under real body weight. Reserve for Phase 3 when the base is built.",
    cues:["Start with a 4-inch step. Not a full stair.","ALWAYS a handrail or wall within reach.","Push through the whole foot of the stepping leg, do not push off the back toe.","Step down slowly and quietly — quiet means controlled."],
    mod:"Not confident on your feet? Skip this permanently and do extra sit-to-stands instead. There is no shame in that trade.", watch:"Neuropathy makes step height hard to judge. Always look at the step." },
  { id:"wallsit", n:"Supported Mini Wall Sit", cat:"Strength", pos:"Back against wall", dose:"3 × 15–20 sec", ph:3,
    why:"An isometric quad builder with the wall carrying your upper body. Shallow angle only — deep wall sits load an arthritic kneecap hard.",
    cues:["Slide down ONLY to a shallow bend — about 30 degrees. Nowhere near 90.","Feet well out in front so the knees never pass the toes.","Breathe out loud through the hold — no breath holding.","Push through the heels to come up."],
    mod:"Place a stability ball behind your back to make it smoother.", watch:"Kneecap ache during or after = you went too deep. Halve the depth." },

  // ---------- CALF, FOOT & NEUROPATHY ----------
  { id:"seatcalf", n:"Seated Calf Raise", cat:"Foot", pos:"Seated, feet flat", dose:"3 × 15–20", ph:1,
    why:"Your calf pump, trained with zero knee load. Every rep physically squeezes fluid up out of the lower leg. This is both strength and drainage for lipedema and neuropathy at once.",
    cues:["Feet flat, knees over ankles.","Push the balls of the feet down and lift the heels as high as they go.","Hold 2 seconds at the top, lower slowly.","Add a book on the thighs for resistance in Phase 2."],
    mod:"Do this at every commercial break, at your desk, in the car as a passenger.", watch:"None. This is one of your safest and highest-value moves." },
  { id:"standcalf", n:"Standing Heel Raise (counter support)", cat:"Foot", pos:"Standing at counter", dose:"3 × 10–15", ph:2,
    why:"The loaded calf pump. Standing puts body weight through the calf, which builds more muscle and moves far more fluid than the seated version.",
    cues:["Fingertips on the counter for balance only.","Rise onto the balls of the feet, hold 2, lower over 3 counts.","Keep the weight even across all the toes, not rolled to the outside.","Knees stay soft and straight."],

/* Tiny dependency-free line chart */
function Spark({ series, color, height=54, inv }) {
  if (!series.length) return <div style={{fontSize:11.5,color:"var(--muted)",padding:"14px 0"}}>No data logged yet.</div>;
  const w = 300, h = height, pad = 4;
  const max = 10, min = 0;
  const step = series.length > 1 ? (w - pad*2) / (series.length - 1) : 0;
  const pts = series.map((v,i) => [pad + i*step, h - pad - ((v - min)/(max - min)) * (h - pad*2)]);
  const path = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = path + " L" + pts[pts.length-1][0].toFixed(1) + " " + (h-pad) + " L" + pad + " " + (h-pad) + " Z";
  return (
    <svg viewBox={"0 0 " + w + " " + h} width="100%" height={h} preserveAspectRatio="none" style={{display:"block"}}>
      <path d={area} fill={color} opacity="0.13"/>
      <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i) => <circle key={i} cx={p[0]} cy={p[1]} r="2.4" fill={color}/>)}
    </svg>
  );
}

function Slider({ label, value, onChange, lo, hi }) {

      <div className="rowb" style={{fontSize:10,color:"var(--muted)",marginTop:-3}}><span>0 · {lo}</span><span>10 · {hi}</span></div>
    </div>
  );
}

              <ol style={{fontSize:12.5,lineHeight:1.9,margin:"5px 0 0 19px"}}>
                {FITTER_QS.map((q,i) => <li key={i} style={{marginBottom:4}}>{q}</li>)}
              </ol>
              <button className="btn bo bsm noprint" style={{marginTop:12}}
                onClick={() => copyText(FITTER_QS.map((q,i) => (i+1) + ". " + q).join("\n"))}>Copy these questions</button>
            </div>

            <LaterSection copyText={copyText}/>
          </div>
        )}

        {/* ================= REPORT ================= */}
        {tab === "report" && (
          <div>
            <div className="ttl">Report for Your PT</div>
            <div className="sub">
              Everything you have logged, formatted to hand over. Bring this to appointments and attach it to
              insurance paperwork.
            </div>
            <div className="card mb2 noprint">
              <div className="row">
                <button className="btn ba" onClick={() => copyText(buildReport())}>Copy report</button>
                <button className="btn bo" onClick={() => window.print()}>Print / save as PDF</button>
                <button className="btn bo" onClick={() => {
                  const blob = new Blob([buildReport()], {type:"text/plain"});
                  const a = document.createElement("a");
                  a.href = URL.createObjectURL(blob);
                  a.download = "leg-health-report-" + today + ".txt";
                  a.click();
                }}>Download .txt</button>
              </div>
            </div>
            <div className="card"><div className="tmpl" style={{maxHeight:"none"}}>{buildReport()}</div></div>
            <div className="card" style={{marginTop:15}}>
              <div className="ctitle">Questions worth asking at your next appointment</div>
              <ul style={{fontSize:12.5,lineHeight:1.85,margin:"5px 0 0 17px"}}>
                <li>Is there a lymphatic component documented in my chart, and if not, should I be assessed for one?</li>
                <li>Can I get a referral to a certified lymphedema therapist (CLT) for manual drainage training?</li>
                <li>Has my arterial circulation been checked before compression, given the neuropathy?</li>
                <li>Is aquatic therapy something you can prescribe, and would insurance cover a course of it?</li>
                <li>Based on my knee imaging, which movements should I take off this list entirely?</li>
                <li>Would adjustable Velcro wraps be appropriate for me on flare days, alongside the stockings?</li>
                <li>What is a realistic strength target for me at 8 weeks, so I know whether this is working?</li>
              </ul>
            </div>
            <div className="card noprint" style={{marginTop:15}}>
              <div className="ctitle">Your data</div>
              <div style={{fontSize:12.5,color:"var(--muted)",lineHeight:1.7,marginBottom:11}}>
                Everything lives in this browser on this device only. Nothing is sent anywhere. That also means
                clearing your browser data will erase it — export a backup now and then.
              </div>
              <div className="row">
                <button className="btn bo bsm" onClick={() => {
                  const blob = new Blob([JSON.stringify(st,null,2)], {type:"application/json"});
                  const a = document.createElement("a");
                  a.href = URL.createObjectURL(blob);
                  a.download = "leg-health-backup-" + today + ".json";
                  a.click();
                }}>Export backup (.json)</button>
                <label className="btn bo bsm" style={{display:"inline-block"}}>
                  Restore backup
                  <input type="file" accept="application/json" style={{display:"none"}} onChange={e => {
                    const f = e.target.files[0]; if (!f) return;
                    const r = new FileReader();
                    r.onload = () => { try { setSt(JSON.parse(r.result)); } catch(err) { alert("That file could not be read."); } };
                    r.readAsText(f);
                  }}/>
                </label>
              </div>
            </div>
          </div>
        )}

        {/* ================= SAFETY ================= */}
        {tab === "safety" && (
          <div>
            <div className="ttl">Red Flags &amp; Ground Rules</div>
            <div className="sub">The short list of things that mean stop, and the rules that keep this program safe.</div>

            <div className="danger">
              <div className="ctitle" style={{color:"var(--rose)"}}>Stop and seek care the same day</div>
              <ul style={{fontSize:12.5,lineHeight:1.9,margin:"5px 0 0 17px"}}>
                <li><strong>Sudden swelling in one leg only</strong>, especially with calf pain, warmth, or redness. This can be a blood clot and it is an emergency, not a wait-and-see. Do not massage the leg, do not put compression on it, go and be assessed.</li>
                <li><strong>Redness that is warm and spreading</strong>, with or without fever or chills. Cellulitis moves fast in lymphatic tissue and needs antibiotics urgently.</li>
                <li><strong>Chest pain or shortness of breath</strong> — call emergency services.</li>
                <li><strong>Any open wound, blister, or ulcer on the foot or leg</strong>, however small, and especially if it does not hurt.</li>
                <li><strong>A knee that locks, gives way, or will not bear weight</strong>, or sudden severe knee swelling after a session.</li>
                <li><strong>Toes that go white, blue, or cold</strong>, or new numbness that started after a garment went on.</li>
                <li><strong>Sudden worsening of numbness or weakness</strong>, or new loss of bladder or bowel control — that is urgent regardless of everything else.</li>
              </ul>
            </div>

            <div className="card mb2">
              <div className="ctitle">Rules that make this program safe</div>
              <ul style={{fontSize:12.5,lineHeight:1.9,margin:"5px 0 0 17px"}}>
                <li><strong>The 24-hour rule.</strong> Soreness that fades within a day is training. Pain that is still elevated 24 hours later means the session was too much — drop the volume by a third and rebuild.</li>
                <li><strong>The 5-out-of-10 ceiling.</strong> Knee pain should never exceed 5/10 during a movement. At 5, stop that exercise. Not "push through" — stop.</li>
                <li><strong>Never barefoot, never unshod during standing work.</strong> Supportive shoes for everything upright.</li>
                <li><strong>Always something to hold.</strong> Every standing exercise here specifies a counter or a rail. That is not a suggestion for someone with numb feet.</li>
                <li><strong>Elevate at the end of every session.</strong> Exercise mobilizes fluid; elevation is what actually removes it. Skipping the cool-down wastes the work.</li>
                <li><strong>No heat on the legs.</strong> No hot tubs, no heating pads, no long hot showers. Heat increases swelling in lipedema and burns skin that cannot feel temperature.</li>
                <li><strong>Do not restrict fluids to reduce swelling.</strong> It does not work and it makes things worse. Drink normally.</li>
                <li><strong>Progress one variable at a time.</strong> More reps, or more resistance, or more minutes — never two in the same week.</li>
                <li><strong>Take the deload.</strong> Any week you feel wrecked, repeat the previous week instead of advancing. Nobody is grading this.</li>
              </ul>
            </div>

            <div className="card mb2">
              <div className="ctitle">Things this program deliberately does not do</div>
              <div style={{fontSize:12.5,lineHeight:1.8}}>
                It does not promise to shrink your thighs, because exercise does not reduce lipedema tissue and
                you deserve to be told that plainly rather than blamed later for a result that was never
                achievable. It does not include high-impact work, deep loaded knee flexion, or unsupported
                balance training, because each of those has a specific risk profile against one of your three
                conditions. And it does not replace your PT — it is built to be handed to them, argued with,
                and adjusted. If your physical therapist tells you to change something here, they have seen your
                knees and your imaging and this app has not. They win.
              </div>
            </div>

            <div className="warn">
              <strong>What this is.</strong> This is an organized, self-directed exercise and tracking tool built
              around the conditions you described. It is not medical advice, not a diagnosis, and not a
              substitute for your physical therapist, your physician, or a certified lymphedema therapist. Run
              the program past your PT before you start it — bring the exercise library tab, it is written so
              they can scan it quickly. Compression, in particular, should never be started without a clinician
              confirming it is safe for your circulation.
            </div>

            <div className="card">
              <div className="ctitle">Specialists worth having on your team</div>
              <ul style={{fontSize:12.5,lineHeight:1.85,margin:"5px 0 0 17px"}}>
                <li><strong>Certified Lymphedema Therapist (CLT).</strong> The highest-value referral available to you. They do manual lymphatic drainage, teach you a self-drainage sequence built for your body, and many are also certified compression fitters.</li>
                <li><strong>Certified compression fitter.</strong> Specifically one who fits custom flat knit, which is a narrower group than general compression suppliers.</li>
                <li><strong>Podiatrist.</strong> For nail and callus care and periodic neuropathy foot exams. With reduced sensation, routine foot care becomes a medical service, not a cosmetic one.</li>
                <li><strong>Vascular assessment.</strong> For the ABI before compression, and to rule out venous disease contributing to the swelling.</li>
                <li><strong>A physician who knows lipedema.</strong> They are not everywhere. The Lipedema Foundation and the Fat Disorders Resource Society both maintain clinician directories worth checking.</li>
              </ul>
            </div>
          </div>
        )}

        </div>
      </div>
    </div>
  </div>
  );
}

/* ============================================================
   PAPERWORK — kept out of the way, because right now the problem is
   sourcing a garment that fits, not fighting a denial. Here if it is
   ever needed.
   ============================================================ */
function LaterSection({ copyText }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="card">
      <div className="rowb" style={{cursor:"pointer"}} onClick={() => setOpen(!open)}>
        <div>
          <div className="ctitle" style={{marginBottom:2}}>If insurance ever does push back</div>
          <div style={{fontSize:12,color:"var(--muted)",lineHeight:1.6}}>
            Not your situation today. Tucked away here in case custom gets denied later.
          </div>
        </div>
        <span style={{color:"var(--muted)",fontSize:18,lineHeight:1}}>{open ? "−" : "+"}</span>
      </div>
      {open && (
        <div style={{marginTop:14}}>
          <div style={{fontSize:12.5,lineHeight:1.8,marginBottom:13}}>
            If you go to order custom flat knit and the plan refuses to cover it, these are the two documents
            that matter. The letter of medical necessity is for your clinician to adapt and sign; the appeal is
            yours to send. The strongest evidence in either one is your measurement sheet showing that your
            numbers land in different stock size categories, plus a photograph of a standard garment sitting at
            mid-calf on you.
          </div>
          <div className="rowb mb">
            <span style={{fontSize:12.5,fontWeight:600,color:"var(--forest)"}}>Letter of medical necessity</span>
            <button className="btn bo bsm" onClick={() => copyText(LMN)}>Copy</button>
          </div>
          <div className="tmpl" style={{maxHeight:230,marginBottom:15}}>{LMN}</div>
          <div className="rowb mb">
            <span style={{fontSize:12.5,fontWeight:600,color:"var(--forest)"}}>Appeal letter</span>
            <button className="btn bo bsm" onClick={() => copyText(APPEAL)}>Copy</button>
          </div>
          <div className="tmpl" style={{maxHeight:230,marginBottom:15}}>{APPEAL}</div>
          <div className="sgtitle">Common denial reasons</div>
          <div className="scroll">
            <table className="tbl">
              <thead><tr><th style={{width:"30%"}}>If they say</th><th>Response</th></tr></thead>
              <tbody>{DENIALS.map((d,i) => (
                <tr key={i}><td><strong>{d.d}</strong></td><td style={{lineHeight:1.7}}>{d.r}</td></tr>
              ))}</tbody>
            </table>
          </div>
          <div className="sgtitle">Coverage notes</div>
          <ul style={{fontSize:12.5,lineHeight:1.85,margin:"5px 0 0 17px"}}>
            {MEDICARE_NOTES.map((m,i) => <li key={i} style={{marginBottom:6}}>{m}</li>)}
          </ul>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   MEASUREMENT SHEET
   ============================================================ */
function MeasureTab({ st, upd, today, copyText }) {
  const last = st.measures[st.measures.length - 1];
  const [d, setD] = useState(() => last ? JSON.parse(JSON.stringify(last)) : { date: today, L:{}, R:{}, Llen:{}, Rlen:{} });
  const [saved, setSaved] = useState(false);

  const set = (side, code, v) => setD(p => ({ ...p, [side]: { ...p[side], [code]: v } }));
  const cell = (side, code) => (
    <input className="minput" type="number" step="0.1" value={d[side]?.[code] ?? ""}
      onChange={e => set(side, code, e.target.value)} placeholder="cm"/>
  );

  const save = () => {
    upd(n => {
      const i = n.measures.findIndex(m => m.date === d.date);
      if (i >= 0) n.measures[i] = d; else n.measures.push(d);
      n.measures.sort((a,b) => a.date.localeCompare(b.date));
    });
    setSaved(true); setTimeout(() => setSaved(false), 2500);
  };

  const asText = () => {
    let o = "CUSTOM COMPRESSION MEASUREMENT SHEET\n";
    o += "Date measured: " + d.date + "   Time of day: morning (before prolonged standing)\n";
    o += "Measured by: ______________________   All values in CENTIMETERS\n\n";
    o += "CIRCUMFERENCES                          LEFT      RIGHT\n";
    CIRC.forEach(c => { o += "  " + (c.c + " " + c.n).padEnd(38) + String(d.L?.[c.c] ?? "____").padEnd(10) + (d.R?.[c.c] ?? "____") + "\n"; });
    o += "\nLENGTHS                                 LEFT      RIGHT\n";
    LEN.forEach(c => { o += "  " + (c.c + " " + c.n).padEnd(38) + String(d.Llen?.[c.c] ?? "____").padEnd(10) + (d.Rlen?.[c.c] ?? "____") + "\n"; });
    o += "\nGARMENT REQUESTED\n";
    o += "  Construction: CUSTOM FLAT KNIT (not circular knit / not ready-made)\n";
    o += "  Compression class: " + (st.comp.cls || "____________") + "\n";
    o += "  Style: " + (st.comp.style || "____________") + "\n";
    o += "  Quantity per limb: ______      Donning aids required: yes\n";
    o += "  Manufacturer: " + (st.comp.maker || "____________") + "\n";
    o += "\nWHY READY-MADE DOES NOT FIT\n";
    o += "  Measurements span multiple stock size categories across cA / cC / cG, and the\n";
    o += "  floor-to-gluteal-fold length (lG) falls outside the standard length range.\n";
    o += "  Ready-made trial outcome: ______________________________________________\n";
    o += "\nNotes: " + (st.comp.notes || "") + "\n";
    return o;
  };

  return (
    <div>
      <div className="ttl">Custom Measurement Sheet</div>
      <div className="sub">
        Fill this in, print it, and take it to your fitter and your insurer. These numbers are the strongest
        argument you have — they turn "standard doesn't fit me" into something a reviewer cannot wave away.
      </div>

      <div className="info">
        <div className="ctitle">The three numbers that decide everything for you</div>
        <ul style={{fontSize:12.5,lineHeight:1.85,margin:"5px 0 0 17px"}}>
          <li><strong>lD — heel to just below the knee bend.</strong> This is the one that fixes knee-highs
            cutting at mid-calf. It decides the length class you order. Get this number and the calf problem
            becomes solvable in a phone call.</li>
          <li><strong>lG — floor to just under the gluteal fold.</strong> Decides thigh-high length. On a tall
            frame this is usually the number that stock sizing gets wrong.</li>
          <li><strong>cH — widest hip.</strong> Decides whether you need a waist or hip anchor, or a pantyhose
            or chaps style, instead of a thigh-high that has nothing to hold onto.</li>
        </ul>
      </div>

      <div className="warn">
        <strong>Take this seriously as evidence.</strong> A fitter should take these measurements themselves,
        and a custom order will be built from theirs, not yours. Yours still matter enormously: they are what
        you attach to a prior authorization to show the disproportion before anyone has agreed to fit you, and
        they are how you prove change over time. Measure carefully, date every sheet, and keep them.
      </div>

      <div className="card mb2">
        <div className="ctitle">How to measure</div>
        <ol style={{fontSize:12.5,lineHeight:1.9,margin:"5px 0 0 19px"}}>
          {MEASURE_RULES.map((r,i) => <li key={i} style={{marginBottom:4}}>{r}</li>)}
        </ol>
      </div>

      <div className="card mb2">
        <div className="rowb mb">
          <div className="ctitle" style={{marginBottom:0}}>Measurements — both legs, in centimeters</div>
          <input type="date" value={d.date} onChange={e => setD(p => ({...p, date:e.target.value}))} style={{width:155}}/>
        </div>
        <div className="scroll">
          <table className="tbl">
            <thead><tr><th style={{width:60}}>Point</th><th>Where to measure</th><th style={{width:90}}>Left</th><th style={{width:90}}>Right</th></tr></thead>
            <tbody>
              {CIRC.map(c => (
                <tr key={c.c}>
                  <td><span className="mcode">{c.c}</span><div style={{fontSize:10.5,color:"var(--muted)"}}>{c.n}</div></td>
                  <td style={{color:"var(--muted)",lineHeight:1.6}}>{c.d}</td>
                  <td>{cell("L", c.c)}</td><td>{cell("R", c.c)}</td>
                </tr>
              ))}
              <tr><td colSpan="4" style={{background:"#eef2ec",fontWeight:600,color:"var(--forest)",fontSize:11,textTransform:"uppercase",letterSpacing:"0.5px"}}>Lengths</td></tr>
              {LEN.map(c => (
                <tr key={c.c}>
                  <td><span className="mcode">{c.c}</span><div style={{fontSize:10.5,color:"var(--muted)"}}>{c.n}</div></td>
                  <td style={{color:"var(--muted)",lineHeight:1.6}}>{c.d}</td>
                  <td>{cell("Llen", c.c)}</td><td>{cell("Rlen", c.c)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <hr/>
        <div className="row noprint">
          <button className="btn ba" onClick={save}>{saved ? "Saved ✓" : "Save this set"}</button>
          <button className="btn bo" onClick={() => window.print()}>Print sheet</button>
          <button className="btn bo" onClick={() => copyText(asText())}>Copy as text</button>
        </div>
      </div>

      <div className="card mb2">
        <div className="ctitle">Garment details</div>
        <div className="g2">
          <div className="mb">
            <span className="lbl">Compression class prescribed</span>
            <select value={st.comp.cls} onChange={e => upd(n => { n.comp.cls = e.target.value; })}>
              <option value="">Not set yet</option>
              {CLASSES.map(c => <option key={c.us} value={c.us}>{c.us}{c.ral !== "—" ? " (" + c.ral + ")" : ""}</option>)}
            </select>
          </div>
          <div className="mb">
            <span className="lbl">Style</span>
            <select value={st.comp.style} onChange={e => upd(n => { n.comp.style = e.target.value; })}>
              <option value="">Not set yet</option>
              {GARMENT_TYPES.map(g => <option key={g.n} value={g.n}>{g.n}</option>)}
            </select>
          </div>
          <div className="mb">
            <span className="lbl">Manufacturer</span>
            <input type="text" value={st.comp.maker} onChange={e => upd(n => { n.comp.maker = e.target.value; })} placeholder="e.g. Juzo Expert"/>
          </div>
          <div className="mb">
            <span className="lbl">Fitter / supplier</span>
            <input type="text" value={st.comp.fitter} onChange={e => upd(n => { n.comp.fitter = e.target.value; })} placeholder="Name and phone"/>
          </div>
        </div>
        <span className="lbl">Fit notes — what went wrong with standard garments</span>
        <textarea rows="3" value={st.comp.notes} onChange={e => upd(n => { n.comp.notes = e.target.value; })}
          placeholder="e.g. size L thigh-high rolled at the top within an hour and left a band mark above the knee that took over an hour to fade; the same size was loose at the ankle"/>
        <div className="foot">
          Write this down in detail while it is fresh. Specific, dated fit-failure descriptions are what an
          appeal reviewer actually reads.
        </div>
      </div>

      {st.measures.length > 1 && (
        <div className="card">
          <div className="ctitle">Change over time — left leg</div>
          <div className="scroll">
            <table className="tbl">
              <thead><tr><th>Point</th>{st.measures.map(m => <th key={m.date}>{m.date}</th>)}<th>Change</th></tr></thead>
              <tbody>
                {CIRC.map(c => {
                  const first = parseFloat(st.measures[0].L?.[c.c]);
                  const lastv = parseFloat(st.measures[st.measures.length-1].L?.[c.c]);
                  const delta = (!isNaN(first) && !isNaN(lastv)) ? (lastv - first).toFixed(1) : null;
                  return (
                    <tr key={c.c}>
                      <td><span className="mcode">{c.c}</span></td>
                      {st.measures.map(m => <td key={m.date}>{m.L?.[c.c] ?? "—"}</td>)}
                      <td>{delta === null ? "—" : <span className={"tag " + (delta < 0 ? "tg" : delta > 0 ? "ty" : "tb")}>{delta > 0 ? "+" : ""}{delta} cm</span>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="foot">
            Do not read too much into small changes — measurement varies by a few millimeters depending on tape
            tension and time of day. A consistent trend across several points over months is meaningful; a
            single number moving is not.
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
